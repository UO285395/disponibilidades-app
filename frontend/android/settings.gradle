pluginManagement {
	repositories {
		google()
		mavenCentral()
		gradlePluginPortal()
	}
	plugins {
		id 'com.android.application' version '8.13.0'
		id 'com.google.gms.google-services' version '4.4.4'
	}
}

// Los plugins de Capacitor 8 (filesystem/share) exigen un toolchain de Java 21.
// Este resolver permite a Gradle descargar automaticamente el JDK 21 que
// necesite si no esta instalado, sin depender de la version del JDK local.
plugins {
	id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'